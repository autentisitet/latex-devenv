name: LtxEngine CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CI: true
  CONTINUOUS_INTEGRATION: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apt-container:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Podman with apt
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Dpkg::Use-Pty=0 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Dpkg::Use-Pty=0 install -y podman

      - name: Restore Podman apt image cache
        id: podman-image-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/latex-devenv/latex-devenv-ci.tar
          key: latex-devenv-podman-${{ runner.os }}-${{ hashFiles('Containerfile', 'installer.sh') }}

      - name: Load cached Podman image
        if: steps.podman-image-cache.outputs.cache-hit == 'true'
        run: podman load --input ~/.cache/latex-devenv/latex-devenv-ci.tar

      - name: Build apt environment with Podman
        if: steps.podman-image-cache.outputs.cache-hit != 'true'
        run: podman build --tag latex-devenv:ci --file Containerfile .

      - name: Verify LaTeX packages and fonts
        run: |
          podman run --rm latex-devenv:ci bash -lc '
            set -euo pipefail
            for command_name in xelatex latexmk kpsewhich fc-match; do
              if command -v "$command_name" >/dev/null; then
                echo "[OK] command: $command_name"
              else
                echo "[ERROR] command not found: $command_name" >&2
                exit 1
              fi
            done
            for tex_file in ctex.sty tcolorbox.sty breqn.sty pgfplots.sty unicode-math.sty; do
              if kpsewhich "$tex_file" >/dev/null; then
                echo "[OK] TeX package: $tex_file"
              else
                echo "[ERROR] TeX package not found: $tex_file" >&2
                exit 1
              fi
            done
            check_font() {
              requested_font="$1"
              expected_pattern="$2"
              matched_font="$(fc-match --format "%{family}\n" "$requested_font")"
              echo "[INFO] font: $requested_font -> $matched_font"
              if ! grep -Fqi "$expected_pattern" <<< "$matched_font"; then
                echo "[ERROR] expected font family was not found: $requested_font" >&2
                exit 1
              fi
            }
            check_font "Noto Serif CJK SC" "Noto Serif CJK SC"
            check_font "TeX Gyre Termes" "TeX Gyre Termes"
            check_font "Latin Modern Roman" "Latin Modern Roman"
          '

      - name: Save Podman image for later CI runs
        if: steps.podman-image-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p ~/.cache/latex-devenv
          podman save --output ~/.cache/latex-devenv/latex-devenv-ci.tar latex-devenv:ci

      - name: Store Podman apt image cache immediately
        if: steps.podman-image-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/latex-devenv/latex-devenv-ci.tar
          key: latex-devenv-podman-${{ runner.os }}-${{ hashFiles('Containerfile', 'installer.sh') }}

      - name: Build LaTeX templates in the container
        run: |
          podman run --rm \
            --volume "${PWD}:/workspace:Z" \
            --workdir /workspace \
            latex-devenv:ci \
            bash -lc '
              set -e
              for template in \
                template/lab-report-template/main.tex \
                template/paper-slides-template/main.tex \
                template/ppt-template/main.tex
              do
                timeout --signal=TERM 8m bash ./ltx-build.sh "$template" --clean
              done
            '

      - name: Archive PDF artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pdf-assets-apt-podman
          path: |
            template/lab-report-template/main.pdf
            template/paper-slides-template/main.pdf
            template/ppt-template/main.pdf
          if-no-files-found: error

  build-windows:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Restore Windows MiKTeX cache
        id: windows-miktex-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/scoop
            ~/AppData/Local/MiKTeX
            ~/AppData/Roaming/MiKTeX
          key: latex-devenv-miktex-${{ runner.os }}-b0ee913-${{ hashFiles('installer.ps1') }}

      - name: Bootstrap pinned Scoop installer
        if: steps.windows-miktex-cache.outputs.cache-hit != 'true'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP 'scoop-install'
          $expectedCommit = 'b0ee913725139b816f9178163af0aecdba07a7ed'
          New-Item -ItemType Directory -Path $installRoot | Out-Null
          git -C $installRoot init
          git -C $installRoot remote add origin https://github.com/ScoopInstaller/Install.git
          git -C $installRoot fetch --depth=1 origin $expectedCommit
          git -C $installRoot checkout --detach FETCH_HEAD
          $actualCommit = git -C $installRoot rev-parse HEAD
          if ($actualCommit -ne $expectedCommit) {
              throw "Unexpected Scoop installer commit: $actualCommit"
          }

          $isAdministrator = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole(
              [Security.Principal.WindowsBuiltInRole]::Administrator
          )
          if ($isAdministrator) {
              & (Join-Path $installRoot 'install.ps1') -RunAsAdmin
          } else {
              & (Join-Path $installRoot 'install.ps1')
          }
          if ($LASTEXITCODE -ne 0) { throw "Scoop installation failed with exit code $LASTEXITCODE" }

      - name: Configure Scoop PATH
        shell: pwsh
        timeout-minutes: 2
        run: |
          $scoopShims = Join-Path $env:USERPROFILE 'scoop\shims'
          if (!(Test-Path $scoopShims)) { throw "Scoop shims were not found: $scoopShims" }
          $env:PATH = "$scoopShims;$env:PATH"
          $scoopShims | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          scoop --version

      - name: Install Windows MiKTeX environment
        if: steps.windows-miktex-cache.outputs.cache-hit != 'true'
        shell: pwsh
        timeout-minutes: 25
        run: .\installer.ps1

      - name: Verify Windows LaTeX dependencies
        shell: pwsh
        timeout-minutes: 5
        run: |
          foreach ($commandName in @('xelatex', 'latexmk', 'kpsewhich')) {
              if (!(Get-Command $commandName -ErrorAction SilentlyContinue)) {
                  throw "Required command was not found: $commandName"
              }
              Write-Host "[OK] command: $commandName"
          }

          foreach ($texFile in @('ctex.sty', 'tcolorbox.sty', 'breqn.sty', 'pgfplots.sty', 'unicode-math.sty')) {
              $resolvedPath = & kpsewhich $texFile
              if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($resolvedPath)) {
                  throw "Required TeX package was not found: $texFile"
              }
              Write-Host "[OK] TeX package: $texFile -> $resolvedPath"
          }

      - name: Store Windows MiKTeX cache
        if: steps.windows-miktex-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/scoop
            ~/AppData/Local/MiKTeX
            ~/AppData/Roaming/MiKTeX
          key: latex-devenv-miktex-${{ runner.os }}-b0ee913-${{ hashFiles('installer.ps1') }}

      - name: Compile templates on Windows for verification
        shell: pwsh
        timeout-minutes: 15
        run: |
          $templates = @(
              'template\lab-report-template\main.tex',
              'template\paper-slides-template\main.tex',
              'template\ppt-template\main.tex'
          )
          foreach ($template in $templates) {
              Write-Host "::group::Windows build: $template"
              & pwsh -NoProfile -File .\ltx-build.ps1 -Template $template -Clean
              if ($LASTEXITCODE -ne 0) { throw "Windows build failed: $template" }
              Write-Host '::endgroup::'
          }

  commit-generated-pdfs:
    needs: [build-apt-container, build-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout main for PDF update
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - name: Download generated PDFs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pdf-assets-apt-podman
          path: .

      - name: Commit generated PDFs to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            template/lab-report-template/main.pdf \
            template/paper-slides-template/main.pdf \
            template/ppt-template/main.pdf

          if git diff --cached --quiet; then
            echo "Generated PDFs are already up to date."
            exit 0
          fi

          git commit -m "docs(pdf): update compiled templates [skip ci]"
          git push origin HEAD:main
